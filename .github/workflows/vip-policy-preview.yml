name: VIP policy preview tests
on:
  pull_request:
    paths:
      - 'docs/integrations/wordpress-vip/**'
      - '.github/workflows/vip-policy-preview.yml'
  push:
    branches: [main]
    paths:
      - 'docs/integrations/wordpress-vip/**'
      - '.github/workflows/vip-policy-preview.yml'
permissions:
  contents: read
jobs:
  offline-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test docs/integrations/wordpress-vip/plan.test.mjs
