# Reverse proxy in front of the wp service, for proxy.sh. Adds X-Forwarded-For
# as any real proxy does. Whether WordPress then sees the visitor or this proxy
# as REMOTE_ADDR is decided by Apache's mod_remoteip in the wp container, which
# proxy.sh switches off and on.
server {
    listen 80;
    location / {
        proxy_pass http://wp:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
